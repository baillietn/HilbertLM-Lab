<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="color-scheme" content="dark">
    <title>HilbertLM Chat</title>
    <link rel="icon" type="image/png" href="../figures/icon.png">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <canvas id="stars" aria-hidden="true"></canvas>

    <div class="app" id="app" data-view="home">
        <header class="topbar">
            <a href="../index.html" class="icon-btn" title="Back to documentation" aria-label="Back to documentation">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                    <polyline points="9 22 9 12 15 12 15 22"></polyline>
                </svg>
            </a>
            <div class="brand">
                <img src="../figures/icon.png" alt="" class="brand-logo">
                <span>HilbertLM</span>
            </div>
            <button type="button" class="new-chat" id="new-chat" title="New chat">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round">
                    <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                    <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                </svg>
                <span>New chat</span>
            </button>
        </header>

        <main class="thread" id="thread">
            <div class="thread-inner" id="messages"></div>
        </main>

        <div class="dock">
            <div class="greeting">
                <span class="orb" aria-hidden="true"></span>
                <h1 id="greeting">Good evening</h1>
            </div>

            <button type="button" class="to-bottom" id="to-bottom" aria-label="Scroll to bottom">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <polyline points="19 12 12 19 5 12"></polyline>
                </svg>
            </button>

            <form class="composer" id="composer">
                <textarea id="user-input" rows="1" placeholder="How can I help you today?"
                    aria-label="Message HilbertLM"></textarea>
                <div class="composer-bar">
                    <span class="composer-hint">English only</span>
                    <span class="model-tag">HilbertLM</span>
                    <button type="button" class="send-btn" id="send-button" data-mode="send"
                        aria-label="Send message" disabled>
                        <svg class="icon-send" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="12" y1="19" x2="12" y2="5"></line>
                            <polyline points="5 12 12 5 19 12"></polyline>
                        </svg>
                        <svg class="icon-stop" viewBox="0 0 24 24">
                            <rect x="6" y="6" width="12" height="12" rx="2.5" fill="currentColor"></rect>
                        </svg>
                    </button>
                </div>
            </form>

            <div class="suggestions" id="suggestions">
                <button type="button" class="chip"
                    data-prompt="Explain what a black hole is in simple terms.">Explain black holes</button>
                <button type="button" class="chip" data-prompt="Write a short poem about the stars.">Write a
                    poem</button>
                <button type="button" class="chip" data-prompt="What is machine learning?">Learn about AI</button>
                <button type="button" class="chip"
                    data-prompt="Write a Python function that reverses a string.">Code in Python</button>
            </div>

            <p class="disclaimer">HilbertLM is a small model and can make mistakes. Please double-check responses.</p>
        </div>
    </div>

    <script src="chat.js"></script>
</body>

</html>
